<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebMCP</title>
    <style>
      html, body, #app { height: 100%; margin: 0; }
      body { font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; color: #e6edf3; background: #0d1117; }
      .empty { padding: 16px; color: #8b949e; }
      header { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border-bottom: 1px solid #30363d; }
      header span { color: #8b949e; font-size: 12px; }
      .invoke { padding: 12px 16px; border-bottom: 1px solid #30363d; display: flex; flex-direction: column; gap: 8px; }
      .invoke textarea {
        width: 100%; min-height: 72px; padding: 8px; border-radius: 6px;
        border: 1px solid #30363d; background: #161b22; color: #e6edf3;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .invoke button {
        align-self: flex-start; padding: 6px 12px; border-radius: 6px;
        border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer;
      }
      .invoke pre {
        margin: 0; padding: 8px; border-radius: 6px; background: #161b22;
        border: 1px solid #30363d; white-space: pre-wrap; word-break: break-word;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      table { width: 100%; border-collapse: collapse; }
      th, td { text-align: left; padding: 6px 12px; border-bottom: 1px solid #21262d; vertical-align: top; }
      th { color: #8b949e; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
      tr.schema td { color: #8b949e; font-size: 12px; padding-top: 0; border-bottom-color: #30363d; }
      tr.active td { background: #161b22; }
      code { font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div id="app" class="empty">Loading WebMCP tools…</div>
    <script src="./config.js"></script>
    <script src="./hub-client.js"></script>
  </body>
</html>
