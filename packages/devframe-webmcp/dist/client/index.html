<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebMCP</title>
    <style>
      :root {
        --bg: #0d1117;
        --panel: #161b22;
        --elevated: #21262d;
        --border: #30363d;
        --text: #e6edf3;
        --muted: #8b949e;
        --accent: #58a6ff;
        --accent-dim: #1f3a5f;
        --ok: #3fb950;
        --fail: #f85149;
      }
      * { box-sizing: border-box; }
      html, body, #app { height: 100%; margin: 0; }
      body {
        font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      #app { display: flex; flex-direction: column; min-height: 0; }
      .empty { padding: 16px; color: var(--muted); }
      header.chrome {
        display: flex; align-items: center; gap: 10px;
        padding: 10px 16px; border-bottom: 1px solid var(--border);
        background: var(--panel); flex-shrink: 0;
      }
      header.chrome h1 { margin: 0; font-size: 14px; font-weight: 600; }
      header.chrome .status { color: var(--muted); font-size: 12px; }
      .search-row {
        padding: 10px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
      }
      .search-row input {
        width: 100%; padding: 8px 10px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--bg); color: var(--text);
        font: inherit;
      }
      .list { flex: 1; min-height: 0; overflow: auto; padding: 8px 0 16px; }
      .group-label {
        padding: 10px 16px 4px; font-size: 11px; font-weight: 600;
        letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted);
      }
      .tool {
        display: flex; align-items: center; gap: 10px; width: 100%;
        padding: 8px 16px; border: none; background: transparent;
        color: var(--text); text-align: left; cursor: pointer; font: inherit;
      }
      .tool:hover, .tool.active { background: var(--accent-dim); }
      .tool-icon {
        width: 16px; height: 16px; flex: none;
      }
      .tool-icon svg { width: 16px; height: 16px; display: block; }
      .tool-copy { min-width: 0; flex: 1; }
      .tool-name { font-weight: 600; }
      .tool-desc {
        color: var(--muted); font-size: 12px; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
      }
      .chevron { color: var(--muted); flex: none; }
      .detail { display: flex; flex-direction: column; min-height: 0; flex: 1; }
      .crumb {
        display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        padding: 10px 16px; border-bottom: 1px solid var(--border);
        background: var(--panel); flex-shrink: 0;
      }
      .crumb button {
        border: none; background: transparent; color: var(--muted);
        cursor: pointer; padding: 0; font: inherit;
      }
      .crumb button:hover { color: var(--text); }
      .crumb strong { font-size: 14px; }
      .badge {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 2px 8px; border-radius: 999px; font-size: 11px;
        border: 1px solid var(--border); background: var(--elevated); color: var(--muted);
      }
      .fields { flex: 1; min-height: 0; overflow: auto; }
      details.block {
        border-bottom: 1px solid var(--border);
      }
      details.block > summary {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 16px; cursor: pointer; font-weight: 600; list-style: none;
      }
      details.block > summary::-webkit-details-marker { display: none; }
      .block-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
      .field label { display: block; font-weight: 600; margin-bottom: 2px; }
      .field .hint { color: var(--muted); font-size: 12px; margin: 0 0 6px; }
      .field input[type="text"], .field input[type="number"], .field textarea {
        width: 100%; padding: 8px 10px; border-radius: 6px;
        border: 1px solid var(--border); background: var(--bg); color: var(--text);
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .field textarea { min-height: 84px; resize: vertical; }
      .field .error { color: var(--fail); font-size: 12px; margin: 4px 0 0; }
      .switch { display: flex; align-items: center; gap: 8px; }
      .result-ok { color: var(--ok); font-size: 12px; font-weight: 600; }
      .result-fail { color: var(--fail); font-size: 12px; font-weight: 600; }
      pre.out {
        margin: 0; padding: 10px; border-radius: 6px; background: var(--elevated);
        border: 1px solid var(--border); white-space: pre-wrap; word-break: break-word;
        font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        max-height: 280px; overflow: auto;
      }
      .footer {
        flex-shrink: 0; padding: 12px 16px; border-top: 1px solid var(--border);
        background: var(--panel);
      }
      .footer button {
        width: 100%; padding: 8px 12px; border-radius: 6px; cursor: pointer;
        border: 1px solid #1f6feb; background: #1f6feb; color: #fff; font: inherit;
      }
      .footer button:disabled { opacity: 0.5; cursor: default; }
      .muted { color: var(--muted); }
    </style>
  </head>
  <body>
    <div id="app" class="empty">Loading WebMCP tools…</div>
    <script src="./config.js"></script>
    <script src="./hub-client.js"></script>
  </body>
</html>
